; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = web
default_envs = esp32s3
extra_configs =
    platformio.local.ini

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
lib_compat_mode = strict
build_flags =
    ; Ohranjen je native USB način, ki ga je uporabljal prejšnji generični DevKitC profil.
    -D ARDUINO_USB_MODE=1
    ; AsyncTCP ne sme teči na omrežnem jedru 0, kjer bi večji LittleFS prenos zadrževal Wi-Fi sklad.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_PRIORITY=10
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    ; Dejanska ploščica ima 8 MB OPI PSRAM; notranji RAM ostane na voljo omrežnemu skladu.
    -D BOARD_HAS_PSRAM
    ; FirebaseClient ne sme ob nedosegljivem omrežju neomejeno povečevati dinamične čakalne vrste.
    -D FIREBASE_ASYNC_QUEUE_LIMIT=4
    ; ElegantOTA uporablja isti asinhroni strežnik kot lokalna nadzorna plošča.
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
extra_scripts =
    pre:scripts/generate_web_gzip.py
lib_deps =
    mobizt/FirebaseClient @ ^2.2.13
    esp32async/ESPAsyncWebServer @ 3.12.0
    ayushsharma82/ElegantOTA @ 3.1.7
    adafruit/Adafruit BME680 Library @ ^2.0.5
    bogde/HX711 @ ^0.7.5
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP

[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
extra_scripts =
    pre:scripts/generate_web_gzip.py
    post:scripts/ota_upload.py
