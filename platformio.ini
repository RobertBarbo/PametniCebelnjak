; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = web

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_compat_mode = strict
build_flags =
    ; AsyncTCP teče na aplikacijskem jedru, zato SD zapis ne zadržuje Wi-Fi sklada na jedru 0.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_PRIORITY=10
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    ; ElegantOTA uporablja isti asinhroni strežnik kot lokalna nadzorna plošča.
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps =
    mobizt/FirebaseClient @ ^2.2.13
    esp32async/ESPAsyncWebServer @ 3.12.0
    ayushsharma82/ElegantOTA @ 3.1.7
    adafruit/Adafruit BME680 Library @ ^2.0.5
    bogde/HX711 @ ^0.7.5
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
